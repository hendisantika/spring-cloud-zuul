server:
  port: 9090

eureka:
  client:
    serviceUrl:
      defaultZone: http://127.0.0.1:8761/eureka/

spring:
  application:
    name: zuul-server

# Routes are defined in com.hendisantika.zuul.config.GatewayRoutesConfig (all under the /api prefix)
gateway:
  routes:
    customer-by-address:
      url: http://localhost:9098
    redirect:
      url: https://example.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
